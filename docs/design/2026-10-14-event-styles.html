<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Event Style Options</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;700&family=Overpass+Mono:wght@400;600&display=swap">
<style>
:root {
  --panel: #e7ece7; --surface: #f5f7f4; --sunk: #dce3dd; --ink: #17212d; --ink-2: #4b5663; --ink-3: #6e7883;
  --rule: #c5cec7; --trunk: #17212d; --proceed: #22724a; --route: #2c5aa2; --danger: #c0312a; --caution: #b97f0c;
  --shadow: 0 1px 0 rgba(23,33,45,.06), 0 6px 18px -10px rgba(23,33,45,.35);
  --f-ui: 'Overpass', system-ui, sans-serif; --f-id: 'Overpass Mono', ui-monospace, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --panel: #11191f; --surface: #18222a; --sunk: #0d1419; --ink: #e2e8e3; --ink-2: #a3aeb5; --ink-3: #7f8a92;
    --rule: #2b3942; --trunk: #dce3dd; --proceed: #52b381; --route: #73a0ea; --danger: #f1665c; --caution: #e8b03d;
    --shadow: 0 1px 0 rgba(0,0,0,.3), 0 8px 22px -10px rgba(0,0,0,.7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --panel: #11191f; --surface: #18222a; --sunk: #0d1419; --ink: #e2e8e3; --ink-2: #a3aeb5; --ink-3: #7f8a92;
  --rule: #2b3942; --trunk: #dce3dd; --proceed: #52b381; --route: #73a0ea; --danger: #f1665c; --caution: #e8b03d;
  --shadow: 0 1px 0 rgba(0,0,0,.3), 0 8px 22px -10px rgba(0,0,0,.7);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--panel); color: var(--ink); font: 14px/1.5 var(--f-ui); }
main { max-width: 1080px; margin: 0 auto; padding: 28px 16px 64px; }
h1 { font-size: 22px; margin: 0 0 4px; }
h2 { font-size: 17px; margin: 0; display: flex; gap: 10px; align-items: baseline; }
h2 .k { font-family: var(--f-id); font-size: 13px; color: var(--surface); background: var(--ink); border-radius: 4px; padding: 1px 7px; }
p.lead { color: var(--ink-2); margin: 0 0 18px; max-width: 820px; }
section { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 16px; margin-bottom: 20px; }
section p { color: var(--ink-2); margin: 6px 0 10px; max-width: 860px; }
.pc { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 24px; font-size: 13px; margin-top: 10px; }
.pc div::before { font-weight: 700; margin-right: 6px; }
.pc .pro::before { content: '+'; color: var(--proceed); }
.pc .con::before { content: '−'; color: var(--danger); }
.scroll { overflow-x: auto; border: 1px solid var(--rule); border-radius: 6px; background: var(--surface); }
svg text { font-family: var(--f-ui); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--ink-2); margin: 0 0 18px; }
.legend svg { width: 14px; height: 14px; vertical-align: -2px; margin-right: 4px; }
@media (max-width: 700px) { .pc { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="t-request" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.992 16.342a2 2 0 0 1 .094 1.167l-1.065 3.29a1 1 0 0 0 1.236 1.168l3.413-.998a2 2 0 0 1 1.099.092 10 10 0 1 0-4.777-4.719"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></g></symbol>
    <symbol id="t-promise" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m11 17 2 2a1 1 0 1 0 3-3"/><path d="m14 14 2.5 2.5a1 1 0 1 0 3-3l-3.88-3.88a3 3 0 0 0-4.24 0l-.88.88a1 1 0 1 1-3-3l2.81-2.81a5.79 5.79 0 0 1 7.06-.87l.47.28a2 2 0 0 0 1.42.25L21 4"/><path d="m21 3 1 11h-2"/><path d="M3 3 2 14l6.5 6.5a1 1 0 1 0 3-3"/><path d="M3 4h8"/></g></symbol>
    <symbol id="t-report_done" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22V12"/><path d="m16 17 2 2 4-4"/><path d="M21 11.127V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.729l7 4a2 2 0 0 0 2 .001l1.32-.753"/><path d="M3.29 7 12 12l8.71-5"/><path d="m7.5 4.27 8.997 5.148"/></g></symbol>
    <symbol id="t-accept" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 7 17l-5-5"/><path d="m22 10-7.5 7.5L13 16"/></g></symbol>
    <symbol id="t-reject" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></g></symbol>
    <symbol id="t-renegotiate" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 14v2.2l1.6 1"/><path d="M16 2v3"/><path d="M21 7.338V5a2 2 0 00-2-2H5a2 2 0 00-2 2v14a2 2 0 002 2h2.338"/><path d="M3 9h5.859"/><path d="M8 2v3"/><circle cx="16" cy="16" r="6"/></g></symbol>
    <symbol id="t-follow_up" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M22 8c0-2.3-.8-4.3-2-6"/><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/><path d="M4 2C2.8 3.7 2 5.7 2 8"/></g></symbol>
    <symbol id="s-slack" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><line x1="4" x2="20" y1="9" y2="9"/><line x1="4" x2="20" y1="15" y2="15"/><line x1="10" x2="8" y1="3" y2="21"/><line x1="16" x2="14" y1="3" y2="21"/></g></symbol>
    <symbol id="s-gmail" viewBox="0 0 24 24"><path fill="currentColor" d="M24 5.457v13.909c0 .904-.732 1.636-1.636 1.636h-3.819V11.73L12 16.64l-6.545-4.91v9.273H1.636A1.636 1.636 0 0 1 0 19.366V5.457c0-2.023 2.309-3.178 3.927-1.964L5.455 4.64 12 9.548l6.545-4.91 1.528-1.145C21.69 2.28 24 3.434 24 5.457z"/></symbol>
    <symbol id="s-linear" viewBox="0 0 24 24"><path fill="currentColor" d="M2.886 4.18A11.982 11.982 0 0 1 11.99 0C18.624 0 24 5.376 24 12.009c0 3.64-1.62 6.903-4.18 9.105L2.887 4.18ZM1.817 5.626l16.556 16.556c-.524.33-1.075.62-1.65.866L.951 7.277c.247-.575.537-1.126.866-1.65ZM.322 9.163l14.515 14.515c-.71.172-1.443.282-2.195.322L0 11.358a12 12 0 0 1 .322-2.195Zm-.17 4.862 9.823 9.824a12.02 12.02 0 0 1-9.824-9.824Z"/></symbol>
    <symbol id="s-paste" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 14h10"/><path d="M16 4h2a2 2 0 0 1 2 2v1.344"/><path d="m17 18 4-4-4-4"/><path d="M8 4H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 1.793-1.113"/><rect x="8" y="2" width="8" height="4" rx="1"/></g></symbol>
  </defs>
</svg>
<main>
  <h1>Event style options</h1>
  <p class="lead">The same four loops and seventeen events, drawn six ways. The W-8 loop has five events in nine days, so each option shows how it handles a crowded stretch. Every option keeps the hover card, the source link, the drag and the canvas zoom.</p>
  <div class="legend" id="legend"></div>
  <div id="options"></div>
</main>
<script>
(() => {
  const DAYS = 30, START = Date.UTC(2026, 8, 10), COL = 128, PX = 30, T = 29;
  const W = COL + DAYS * PX + 20;
  const TYPE = { request: 'Request', promise: 'Promise', report_done: 'Done', accept: 'Accept', reject: 'Reject', renegotiate: 'Change', follow_up: 'Follow-up' };
  const E = (t, type, who, src, label, q) => ({ t, type, who, src, label, q });
  const loops = [
    { lane: 'Implementation', title: 'Go-live date', tone: 'route', state: 'promised', end: 'open', events: [
      E(1.4, 'request', 'Sarah Kim', 'gmail', 'Go-live plan', 'Can Fund III go live before the end of Q3?'),
      E(2.5, 'promise', 'Minh Trần', 'gmail', 'Go-live plan', 'We will go live by 30 September.'),
      E(19.6, 'renegotiate', 'Minh Trần', 'slack', '#larkspur-onboarding', 'We need to move go-live to 15 October.'),
      E(20.4, 'accept', 'Sarah Kim', 'slack', '#larkspur-onboarding', 'OK, 15 October works for us.') ] },
    { lane: 'Engineering', title: 'PG-112 Fund III data import', tone: 'proceed', state: 'closed', end: 'merge', events: [
      E(3.4, 'request', 'Minh Trần', 'linear', 'PG-112', 'Created and assigned to Quang.'),
      E(4.4, 'promise', 'Quang Nguyễn', 'linear', 'PG-112', 'In Progress. Due 26 Sep.'),
      E(14.6, 'report_done', 'Quang Nguyễn', 'linear', 'PG-112', 'In Progress → In Review.'),
      E(15.4, 'accept', 'Minh Trần', 'linear', 'PG-112', 'In Review → Done.') ] },
    { lane: 'Engineering', title: 'Incident report', tone: 'danger', state: 'overdue', end: 'open', broken: 16.5, events: [
      E(8.6, 'request', 'Sarah Kim', 'gmail', 'Sync outage', 'Please send a root cause report.'),
      E(9.5, 'promise', 'Quang Nguyễn', 'gmail', 'Sync outage', 'You will have it by Friday.'),
      E(21.5, 'follow_up', 'Sarah Kim', 'slack', '#larkspur-it', 'Any update on the report?') ] },
    { lane: 'Fund Operations', title: 'W-8 form review', tone: 'proceed', state: 'closed', end: 'merge', events: [
      E(5.4, 'request', 'Minh Trần', 'gmail', 'W-8 forms', 'Please send the signed W-8 forms.'),
      E(5.9, 'promise', 'Priya Shah', 'gmail', 'W-8 forms', 'We will send them this week.'),
      E(10.6, 'report_done', 'Priya Shah', 'paste', 'Call notes', 'Forms attached.'),
      E(11.3, 'reject', 'Minh Trần', 'gmail', 'W-8 forms', 'Page 2 is missing a signature.'),
      E(12.6, 'report_done', 'Priya Shah', 'gmail', 'W-8 forms', 'Signed copy attached.'),
      E(13.4, 'accept', 'Minh Trần', 'gmail', 'W-8 forms', 'All correct now.') ] },
  ];
  const lanes = ['Implementation', 'Engineering', 'Fund Operations'];
  const NS = 'http://www.w3.org/2000/svg';
  const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const el = (name, attrs, parent) => { const n = document.createElementNS(NS, name); for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v); if (parent) parent.appendChild(n); return n; };
  const X = (t) => COL + t * PX;
  const first = (name) => name.split(' ')[0];
  const day = (t) => new Date(START + Math.floor(t) * 864e5).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', timeZone: 'UTC' });
  const textW = (s, size = 11) => s.length * size * 0.56;
  const use = (parent, id, x, y, size, color) => el('use', { href: '#' + id, x, y, width: size, height: size, color }, parent);
  const tint = (tone, pct) => `color-mix(in srgb, ${css('--' + tone)} ${pct}%, ${css('--surface')})`;

  // Shared frame: lane stripes, lane names, weekly grid, T line. rows: [{loop, top, height}]
  function frame(svg, rows, height) {
    svg.setAttribute('width', W); svg.setAttribute('height', height); svg.setAttribute('viewBox', `0 0 ${W} ${height}`);
    let top = 26, i = 0;
    for (const lane of lanes) {
      const laneRows = rows.filter((r) => r.loop.lane === lane);
      const h = laneRows.reduce((s, r) => s + r.height, 0);
      el('rect', { x: 0, y: top, width: W, height: h, fill: i % 2 ? css('--panel') : 'transparent', opacity: .5 }, svg);
      el('text', { x: 12, y: top + h / 2 + 4, 'font-size': 12, 'font-weight': 600, fill: css('--ink-2') }, svg).textContent = lane;
      let y = top; for (const r of laneRows) { r.top = y; y += r.height; }
      top += h; i++;
    }
    el('line', { x1: COL - 6, y1: 0, x2: COL - 6, y2: height, stroke: css('--rule') }, svg);
    for (let d = 0; d <= DAYS; d += 7) {
      el('line', { x1: X(d), y1: 18, x2: X(d), y2: height, stroke: css('--rule'), 'stroke-width': .6 }, svg);
      el('text', { x: X(d) + 3, y: 14, 'font-size': 10, fill: css('--ink-3') }, svg).textContent = day(d);
    }
    el('line', { x1: X(T), y1: 18, x2: X(T), y2: height, stroke: css('--ink'), 'stroke-dasharray': '3 3' }, svg);
    el('text', { x: X(T) - 4, y: 14, 'font-size': 10, 'font-weight': 700, 'text-anchor': 'end', fill: css('--ink') }, svg).textContent = 'T';
  }
  const lineEnd = (lp) => lp.end === 'merge' ? X(lp.events.at(-1).t) : X(T);
  function baseLine(svg, lp, y, width = 3) {
    el('line', { x1: X(lp.events[0].t), y1: y, x2: lineEnd(lp), y2: y, stroke: css('--' + lp.tone), 'stroke-width': width }, svg);
    if (lp.broken) { const bx = X(lp.broken); el('circle', { cx: bx, cy: y, r: 8, fill: css('--surface'), stroke: css('--danger'), 'stroke-width': 1.6 }, svg); el('path', { d: `M${bx - 3.5} ${y - 3.5} L${bx + 3.5} ${y + 3.5} M${bx - 3.5} ${y + 3.5} L${bx + 3.5} ${y - 3.5}`, stroke: css('--danger'), 'stroke-width': 2 }, svg); }
  }
  const evColor = (lp, e) => e.type === 'reject' ? css('--danger') : css('--' + lp.tone);

  // A: icon badges.
  function optionA(svg) {
    const rows = loops.map((loop) => ({ loop, height: 70 })); const H = 26 + rows.reduce((s, r) => s + r.height, 0) + 6;
    frame(svg, rows, H);
    for (const r of rows) {
      const lp = r.loop, y = r.top + 30; baseLine(svg, lp, y);
      el('text', { x: X(lp.events[0].t), y: y + 34, 'font-size': 11, 'font-weight': 700, fill: css('--ink') }, svg).textContent = lp.title;
      let prev = -1e9;
      lp.events.forEach((e) => {
        const tx = X(e.t), x = Math.max(tx, prev + 30); prev = x; const c = evColor(lp, e);
        if (x !== tx) el('path', { d: `M${tx} ${y} Q${tx} ${y - 18} ${x - 13} ${y - 13}`, fill: 'none', stroke: css('--ink-3'), 'stroke-width': 1, 'stroke-dasharray': '2 2' }, svg);
        el('rect', { x: x - 13, y: y - 13, width: 26, height: 26, rx: 7, fill: css('--surface'), stroke: c, 'stroke-width': 2 }, svg);
        use(svg, 't-' + e.type, x - 8, y - 8, 16, c);
        el('circle', { cx: x + 12, cy: y + 12, r: 7, fill: css('--surface'), stroke: css('--rule') }, svg);
        use(svg, 's-' + e.src, x + 7.5, y + 7.5, 9, css('--ink-2'));
      });
    }
  }
  // B: pills on the line.
  function optionB(svg) {
    const rows = loops.map((loop) => ({ loop, height: 92 })); const H = 26 + rows.reduce((s, r) => s + r.height, 0) + 6;
    frame(svg, rows, H);
    for (const r of rows) {
      const lp = r.loop, y = r.top + 44; baseLine(svg, lp, y, 2);
      el('text', { x: X(lp.events[0].t), y: y + 40, 'font-size': 11, 'font-weight': 700, fill: css('--ink') }, svg).textContent = lp.title;
      const placed = [];
      lp.events.forEach((e) => {
        const text = `${TYPE[e.type]} · ${first(e.who)}`, w = 16 + 4 + textW(text) + 6 + 11 + 10, c = evColor(lp, e);
        const x0 = X(e.t) - 10;
        let level = 0; const levels = [0, -26, 26, -52];
        while (placed.some((p) => p.level === level && x0 < p.x1 + 4 && x0 + w > p.x0 - 4)) level = levels[levels.indexOf(level) + 1] ?? level + 26;
        placed.push({ x0, x1: x0 + w, level });
        const py = y + level;
        if (level) el('line', { x1: X(e.t), y1: y, x2: X(e.t), y2: py, stroke: c, 'stroke-width': 1.5 }, svg);
        el('rect', { x: x0, y: py - 11, width: w, height: 22, rx: 11, fill: tint(lp.tone, 14), stroke: c, 'stroke-width': 1.5 }, svg);
        use(svg, 't-' + e.type, x0 + 6, py - 7, 14, c);
        el('text', { x: x0 + 24, y: py + 4, 'font-size': 11, 'font-weight': 600, fill: css('--ink') }, svg).textContent = text;
        use(svg, 's-' + e.src, x0 + w - 17, py - 5.5, 11, css('--ink-2'));
      });
    }
  }
  // C: callout cards above the line, stacked on shelves.
  function optionC(svg) {
    const CW = 170, CH = 58, GAP = 8;
    const plan = loops.map((lp) => { const placed = []; for (const e of lp.events) { const x0 = Math.min(Math.max(X(e.t) - 20, COL), W - CW - 6); let shelf = 0; while (placed.some((p) => p.shelf === shelf && x0 < p.x0 + CW + GAP && x0 + CW + GAP > p.x0)) shelf++; placed.push({ e, x0, shelf }); } return { lp, placed, shelves: Math.max(...placed.map((p) => p.shelf)) + 1 }; });
    const rows = plan.map((p) => ({ loop: p.lp, plan: p, height: 30 + p.shelves * (CH + 10) + 26 })); const H = 26 + rows.reduce((s, r) => s + r.height, 0) + 6;
    frame(svg, rows, H);
    for (const r of rows) {
      const lp = r.loop, y = r.top + r.height - 34; baseLine(svg, lp, y);
      el('text', { x: X(lp.events[0].t), y: y + 22, 'font-size': 11, 'font-weight': 700, fill: css('--ink') }, svg).textContent = lp.title;
      for (const p of r.plan.placed) {
        const e = p.e, c = evColor(lp, e), cy = y - 16 - CH - p.shelf * (CH + 10), tx = X(e.t);
        el('line', { x1: tx, y1: y, x2: tx, y2: cy + CH, stroke: c, 'stroke-width': 1.5 }, svg);
        el('circle', { cx: tx, cy: y, r: 4.5, fill: c }, svg);
        el('rect', { x: p.x0, y: cy, width: CW, height: CH, rx: 8, fill: css('--surface'), stroke: css('--rule') }, svg);
        el('rect', { x: p.x0, y: cy, width: 4, height: CH, rx: 2, fill: c }, svg);
        use(svg, 't-' + e.type, p.x0 + 10, cy + 7, 14, c);
        el('text', { x: p.x0 + 28, y: cy + 18, 'font-size': 11, 'font-weight': 700, fill: css('--ink') }, svg).textContent = `${TYPE[e.type]} · ${first(e.who)}`;
        el('text', { x: p.x0 + CW - 8, y: cy + 18, 'font-size': 10, 'text-anchor': 'end', fill: css('--ink-3') }, svg).textContent = day(e.t);
        el('text', { x: p.x0 + 10, y: cy + 35, 'font-size': 10.5, 'font-style': 'italic', fill: css('--ink-2') }, svg).textContent = '“' + (e.q.length > 30 ? e.q.slice(0, 29) + '…' : e.q) + '”';
        use(svg, 's-' + e.src, p.x0 + 10, cy + 42, 10, css('--route'));
        el('text', { x: p.x0 + 24, y: cy + 51, 'font-size': 10, 'font-weight': 600, fill: css('--route') }, svg).textContent = e.label + ' ↗';
      }
    }
  }
  // D: storyboard cards in sequence, each with a lead to its exact time.
  function optionD(svg) {
    const CW = 132, CH = 62, GAP = 8;
    const rows = loops.map((loop) => ({ loop, height: 128 })); const H = 26 + rows.reduce((s, r) => s + r.height, 0) + 6;
    frame(svg, rows, H);
    for (const r of rows) {
      const lp = r.loop, y = r.top + 96; baseLine(svg, lp, y, 2);
      el('text', { x: X(lp.events[0].t), y: y + 20, 'font-size': 11, 'font-weight': 700, fill: css('--ink') }, svg).textContent = lp.title;
      let prevRight = -1e9;
      lp.events.forEach((e) => {
        const tx = X(e.t), x0 = Math.max(tx - CW / 2, prevRight + GAP, COL); prevRight = x0 + CW; const c = evColor(lp, e), cy = y - 20 - CH;
        const mx = x0 + CW / 2;
        el('path', { d: `M${mx} ${cy + CH} L${mx} ${cy + CH + 8} L${tx} ${y - 6} L${tx} ${y}`, fill: 'none', stroke: c, 'stroke-width': 1.3 }, svg);
        el('circle', { cx: tx, cy: y, r: 4.5, fill: c }, svg);
        el('rect', { x: x0, y: cy, width: CW, height: CH, rx: 8, fill: tint(lp.tone, 8), stroke: c, 'stroke-width': 1.2 }, svg);
        use(svg, 't-' + e.type, x0 + 8, cy + 8, 15, c);
        el('text', { x: x0 + 28, y: cy + 20, 'font-size': 11.5, 'font-weight': 700, fill: css('--ink') }, svg).textContent = TYPE[e.type];
        el('text', { x: x0 + CW - 8, y: cy + 20, 'font-size': 10, 'text-anchor': 'end', fill: css('--ink-3') }, svg).textContent = day(e.t);
        el('text', { x: x0 + 8, y: cy + 37, 'font-size': 10.5, fill: css('--ink-2') }, svg).textContent = e.who;
        use(svg, 's-' + e.src, x0 + 8, cy + 44, 10, css('--route'));
        el('text', { x: x0 + 22, y: cy + 53, 'font-size': 10, 'font-weight': 600, fill: css('--route') }, svg).textContent = (e.label.length > 15 ? e.label.slice(0, 14) + '…' : e.label) + ' ↗';
      });
    }
  }
  // E: Gantt bars with event icons inside.
  function optionE(svg, expandIndex = -1) {
    const rows = loops.map((loop, i) => ({ loop, height: i === expandIndex ? 150 : 52 })); const H = 26 + rows.reduce((s, r) => s + r.height, 0) + 6;
    frame(svg, rows, H);
    rows.forEach((r, i) => {
      const lp = r.loop, y = r.top + 26, x0 = X(lp.events[0].t) - 14, x1 = lineEnd(lp) + 14, c = css('--' + lp.tone);
      el('rect', { x: x0, y: y - 15, width: x1 - x0, height: 30, rx: 8, fill: tint(lp.tone, 16), stroke: c, 'stroke-width': 1.5 }, svg);
      let prev = -1e9; const icons = [];
      lp.events.forEach((e) => { const x = Math.max(X(e.t), prev + 22); prev = x; icons.push(x); const ec = evColor(lp, e);
        el('circle', { cx: x, cy: y, r: 10, fill: css('--surface'), stroke: ec, 'stroke-width': 1.5 }, svg); use(svg, 't-' + e.type, x - 6.5, y - 6.5, 13, ec); });
      const gaps = icons.slice(1).map((x, k) => [icons[k], x]).filter(([a, b]) => b - a > textW(lp.title, 12) + 40);
      const tx = gaps.length ? gaps[0][0] + 16 : x1 + 8;
      el('text', { x: tx, y: y + 4, 'font-size': 12, 'font-weight': 700, fill: css('--ink') }, svg).textContent = lp.title;
      const chipText = lp.state, cw = textW(chipText, 10) + 14, chipX = x1 - cw - 6;
      if (lp.end !== 'merge' && chipX > icons.at(-1) + 16) { el('rect', { x: chipX, y: y - 9, width: cw, height: 18, rx: 9, fill: lp.state === 'overdue' ? css('--danger') : c }, svg); el('text', { x: chipX + cw / 2, y: y + 4, 'font-size': 10, 'font-weight': 700, 'text-anchor': 'middle', fill: css('--surface') }, svg).textContent = chipText; }
      if (lp.broken) { const bx = X(lp.broken); el('path', { d: `M${bx} ${y - 15} l6 0 l-3 6 z`, fill: css('--danger') }, svg); }
      if (i === expandIndex) {
        let prevRight = -1e9; const CW = 132, CH = 60;
        lp.events.forEach((e, k) => { const ix = icons[k], cx0 = Math.max(ix - CW / 2, prevRight + 8, COL); prevRight = cx0 + CW; const ec = evColor(lp, e), cy = y + 34;
          el('path', { d: `M${ix} ${y + 10} L${ix} ${y + 22} L${cx0 + CW / 2} ${cy}`, fill: 'none', stroke: ec, 'stroke-width': 1.2 }, svg);
          el('rect', { x: cx0, y: cy, width: CW, height: CH, rx: 8, fill: css('--surface'), stroke: ec, 'stroke-width': 1.2 }, svg);
          use(svg, 't-' + e.type, cx0 + 8, cy + 8, 14, ec);
          el('text', { x: cx0 + 27, y: cy + 19, 'font-size': 11, 'font-weight': 700, fill: css('--ink') }, svg).textContent = `${TYPE[e.type]} · ${first(e.who)}`;
          el('text', { x: cx0 + 8, y: cy + 36, 'font-size': 10.5, 'font-style': 'italic', fill: css('--ink-2') }, svg).textContent = '“' + (e.q.length > 22 ? e.q.slice(0, 21) + '…' : e.q) + '”';
          use(svg, 's-' + e.src, cx0 + 8, cy + 43, 10, css('--route'));
          el('text', { x: cx0 + 22, y: cy + 52, 'font-size': 10, fill: css('--ink-3') }, svg).textContent = day(e.t);
        });
      }
    });
  }

  const OPTIONS = [
    { k: 'A', name: 'Icon badges', fn: optionA, text: 'Each dot becomes a 26 px rounded square with an icon for the act type (question, handshake, parcel, double check, cross, calendar, bell) and a small app badge. Close events slide right and keep a dotted lead to their exact time.', pros: ['Smallest change from today; lines and forks stay as they are', 'The type is readable without zooming or hovering'], cons: ['Still no names or text: who and what need the hover card', 'Dense stretches push badges away from their exact time'] },
    { k: 'B', name: 'Pills on the line', fn: optionB, text: 'Each event is a rounded pill on the branch line: type icon, "Promise · Minh", app icon. Pills that would overlap move to a lane above or below the line, with a short stick to the line.', pros: ['Type and person readable at a glance', 'Rows stay compact; works well at 100 %'], cons: ['Crowded stretches stack pills up and down, which can look busy', 'No quote on the board'] },
    { k: 'C', name: 'Callout cards', fn: optionC, text: 'Each event is a card above the line with a stem to its exact time: type, person, date, a short quote and the source link. Cards that would overlap go up to the next shelf.', pros: ['Everything readable without hovering: who, when, what, where from', 'Exact times stay exact (the stem)'], cons: ['Rows get tall: the W-8 loop needs two shelves', 'The graph shows far fewer loops per screen'] },
    { k: 'D', name: 'Storyboard cards', fn: optionD, text: 'Cards sit in time order along the loop, one row, never overlapping. A bent lead joins each card to its exact time on the line. Reads like a comic strip of the loop.', pros: ['One card row per loop, always tidy, in order', 'Rich content: type, date, person, source'], cons: ['A card can sit days away from its time; the lead shows the true time', 'Taller rows than today (about 2×)'] },
    { k: 'E', name: 'Gantt bars', fn: (svg) => optionE(svg, -1), text: 'Each loop is one bar from its first act to its end, as in Jira, Linear or MS Project timelines. Events are small icons inside the bar; the title and a state chip sit in the bar. Details come from the hover card.', pros: ['Calmest and most compact: many loops per screen', 'Familiar to project managers'], cons: ['Events are small icons only', 'The promise-graph look (forks from the trunk) goes away'] },
    { k: 'F', name: 'Gantt bars + cards on demand', fn: (svg) => optionE(svg, 3), text: 'Option E as the overview, and a loop opens into storyboard cards under its bar when you click it or zoom past 150 %. Here the W-8 loop is open.', pros: ['Calm overview and rich detail where you look', 'Scales to big projects'], cons: ['Two modes to build and test', 'Details of several loops at once need several clicks'] },
  ];
  const legend = document.getElementById('legend');
  legend.innerHTML = Object.entries(TYPE).map(([k, v]) => `<span><svg><use href="#t-${k}"/></svg>${v}</span>`).join('') + '<span><svg><use href="#s-gmail"/></svg>Gmail</span><span><svg><use href="#s-slack"/></svg>Slack</span><span><svg><use href="#s-linear"/></svg>Linear</span><span><svg><use href="#s-paste"/></svg>Paste</span>';
  const root = document.getElementById('options');
  for (const o of OPTIONS) {
    const s = document.createElement('section');
    s.innerHTML = `<h2><span class="k">${o.k}</span>${o.name}</h2><p>${o.text}</p><div class="scroll"><svg role="img" aria-label="Option ${o.k}: ${o.name}"></svg></div><div class="pc">${o.pros.map((p) => `<div class="pro">${p}</div>`).join('')}${o.cons.map((c) => `<div class="con">${c}</div>`).join('')}</div>`;
    root.appendChild(s);
    o.fn(s.querySelector('svg'));
  }
})();
</script>
