name: checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: promise_graph
          POSTGRES_PASSWORD: local-development-only
          POSTGRES_DB: promise_graph
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U promise_graph -d promise_graph'
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://promise_graph:local-development-only@localhost:5432/promise_graph
      TEST_DATABASE_URL: postgresql://promise_graph:local-development-only@localhost:5432/promise_graph
      AUTH_MODE: local
      SESSION_SECRET: ci-only-32-byte-session-secret-not-for-production-use
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm check:providers
      - run: pnpm test
      - run: pnpm eval
      - run: pnpm build
