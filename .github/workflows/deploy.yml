# Deploys a v* tag to Cloud Run. One-time setup: scripts/setup-github-cd.sh and
# docs/deploy-cloud-run-neon.md ("Deploy from a tag").
name: deploy
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'The v* tag to deploy. Select the same tag in "Use workflow from".'
        required: true
        type: string
permissions:
  contents: read
# A whole run waits for the one before it, so an older tag never deploys after a newer one.
concurrency:
  group: deploy
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.tag.outputs.name }}
    steps:
      - id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF: ${{ github.ref }}
        # Google accepts only an ID token of a refs/tags/v* run, so a hand run must start from the tag.
        run: |
          tag="${INPUT_TAG:-${REF#refs/tags/}}"
          if [ "$REF" != "refs/tags/$tag" ]; then
            echo "::error::Run the workflow from the tag itself: gh workflow run deploy.yml --ref $tag -f tag=$tag"
            exit 1
          fi
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9A-Za-z._-]{1,127}$'; then
            echo "::error::$tag is not a v* tag that Docker accepts (letters, digits, '.', '_', '-')."
            exit 1
          fi
          echo "name=$tag" >> "$GITHUB_OUTPUT"

  checks:
    needs: tag
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: [tag, checks]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ needs.tag.outputs.name }}
      PROJECT: promise-graph
      REGION: asia-southeast1
      SERVICE: promise-graph
      IMAGE: asia-southeast1-docker.pkg.dev/promise-graph/promise-graph/app
      # The deployer account may not read Service Usage, so gcloud must not check the enabled APIs.
      CLOUDSDK_CORE_SHOULD_PROMPT_TO_ENABLE_API: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Build and push the image
        run: |
          gcloud auth configure-docker asia-southeast1-docker.pkg.dev --quiet
          docker build -t "$IMAGE:$TAG" -t "$IMAGE:$GITHUB_SHA" .
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:$GITHUB_SHA"
      # Only the image changes: the service keeps the env vars, secrets, account and limits of the
      # manual deploy (scripts/deploy-cloud-run.sh).
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" --project "$PROJECT" --region "$REGION" \
            --image "$IMAGE:$TAG" --quiet
      - name: Wait for the new revision and check its health
        run: |
          service="$RUNNER_TEMP/service.json"
          ready=""
          for attempt in $(seq 1 30); do
            gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" \
              --format=json > "$service"
            if jq -e --arg image "$IMAGE:$TAG" '
              .status as $s
              | $s.latestReadyRevisionName == $s.latestCreatedRevisionName
                and .spec.template.spec.containers[0].image == $image
                and ([$s.traffic[]? | select(.revisionName == $s.latestReadyRevisionName) | .percent] | add) == 100
            ' "$service" > /dev/null; then
              ready=1
              break
            fi
            sleep 5
          done
          if [ -z "$ready" ]; then
            echo "::error::The new revision does not serve all traffic. See Cloud Run > $SERVICE > Revisions."
            exit 1
          fi
          revision="$(jq -r .status.latestReadyRevisionName "$service")"
          url="$(jq -r .status.url "$service")"
          healthy=""
          for attempt in $(seq 1 20); do
            if body="$(curl -fsS --max-time 10 "$url/api/health")" &&
              [ "$(printf '%s' "$body" | jq -r .status)" = ok ]; then
              healthy=1
              break
            fi
            sleep 5
          done
          if [ -z "$healthy" ]; then
            echo "::error::$url/api/health does not return ok. See Cloud Run > $SERVICE > Logs."
            exit 1
          fi
          {
            echo "### Deployed $TAG"
            echo ""
            echo "- URL: $url"
            echo "- Revision: $revision"
            echo "- Image: $IMAGE:$TAG ($GITHUB_SHA)"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Deployed $TAG to $url"

  # A release per deployed tag; a second deploy of the same tag (a rollback) keeps the release it has.
  release:
    needs: [tag, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.tag.outputs.name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Create the GitHub release
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG exists"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --generate-notes
          fi
